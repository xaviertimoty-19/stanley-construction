<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 110" width="100%" height="100%" fill="none">
  <g transform="translate(15, 12)">
    <!-- ================= EMBLÈME BLASON NOIR ET JAUNE ================= -->
    <path d="M 0 14 L 38 0 L 76 14 L 76 72 L 38 86 L 0 72 Z" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
    
    <!-- Bordure d'angle supérieure Jaune Sécurité -->
    <path d="M 0 14 L 38 0 L 76 14 L 68 17 L 38 6 L 8 17 Z" fill="#f59e0b" />

    <!-- Le "S" Industriel Épais en Jaune Vif -->
    <path d="M 18 22 L 58 22 L 58 35 L 34 35 L 34 42 L 58 46 L 58 64 L 18 64 L 18 51 L 42 51 L 42 46 L 18 42 Z" 
          fill="#f59e0b" />
          
    <!-- Séparateur d'acier biseauté au centre du S -->
    <polygon points="34,35 42,35 34,42 26,42" fill="#d97706" />
    <polygon points="50,46 58,46 50,51 42,51" fill="#b45309" />
  </g>

  <!-- ================= TYPOGRAPHIE STANLEY CONSTRUCTION ================= -->
  <g transform="translate(112, 18)">
    <!-- STANLEY (Majuscules Massives, Blanc Lumineux pour Dark Theme) -->
    <text x="0" y="44" 
          font-family="'Arial Black', 'Montserrat', Impact, sans-serif" 
          font-weight="900" 
          font-size="44" 
          letter-spacing="2" 
          fill="#f8fafc">
      STANLEY
    </text>

    <!-- BANDEAU SOUS-TITRE ENCART NOIR & LETTRES JAUNES -->
    <rect x="2" y="56" width="240" height="22" rx="3" fill="#09090b" stroke="#27272a" stroke-width="1" />
    
    <!-- POINT DE RAPPEL DE NIVEAU JAUNE -->
    <rect x="2" y="56" width="7" height="22" rx="2" fill="#f59e0b" />
    
    <!-- CONSTRUCTION -->
    <text x="126" y="71" 
          text-anchor="middle"
          font-family="'Arial Black', 'Montserrat', sans-serif" 
          font-weight="900" 
          font-size="12" 
          letter-spacing="8" 
          fill="#f59e0b">
      CONSTRUCTION
    </text>
  </g>
</svg>
